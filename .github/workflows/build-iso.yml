name: Build MyOS ISO

# Скрипт будет запускаться при каждом пуше в ветку main 
# и вручную по кнопке "Run workflow" (workflow_dispatch)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Добавлены dwarves, cpio и rsync - они критически важны для сборки ядра!
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libncurses-dev \
          libssl-dev libelf-dev bc wget xorriso grub-pc-bin grub-efi mtools dialog \
          dwarves cpio rsync

      - name: Compile Kernel, Busybox and Build ISO
        run: |
          chmod +x build_os.sh
          sudo ./build_os.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my_os_bootable_iso
          path: my_os.iso
          retention-days: 7
